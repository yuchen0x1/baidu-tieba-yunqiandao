name: tieba-cloud-sign

services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: tieba-cloud-sign:local
    restart: unless-stopped
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      DB_HOST: ${DB_HOST:-db}
      DB_USER: ${DB_USER:-root}
      DB_PASSWD: ${DB_PASSWD:?DB_PASSWD is required}
      DB_NAME: ${DB_NAME:-tiebacloud}
      DB_SSL: ${DB_SSL:-0}
      CSRF: ${CSRF:-true}
      TC_AUTO_CREATE_INSTALL_LOCK: ${TC_AUTO_CREATE_INSTALL_LOCK:-false}
      UPDATE_GITHUB_TOKEN: ${UPDATE_GITHUB_TOKEN:-}
      HOME: /tmp/caddy
      XDG_CONFIG_HOME: /tmp/caddy/config
      XDG_DATA_HOME: /tmp/caddy/data
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - tieba
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/favicon.ico"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-tiebacloud}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWD:?DB_PASSWD is required}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --slow_query_log=1
      - --long_query_time=1
      - --log_output=TABLE
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - tieba
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mysql_data:

networks:
  tieba:
    driver: bridge

