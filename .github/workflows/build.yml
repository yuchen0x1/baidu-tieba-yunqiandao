name: 构建镜像

on:
  workflow_dispatch:
    inputs:
      publish_dockerhub:
        description: Publish the current stable release to Docker Hub
        type: boolean
        default: false
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: tieba-cloud-sign

jobs:
  build:
    runs-on: ubuntu-latest
    name: 构建镜像
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      -
        # SYSTEM_VER 的唯一来源是 version.php（V7.0 起不再写在 init.php）
        name: Get version
        run: |
          version=$(sed -n "s/^.*define('SYSTEM_VER', '\([^']*\)');.*/\1/p" version.php | tr -d '[:space:]')
          if [ -z "$version" ]; then
            echo "无法从 version.php 解析 SYSTEM_VER" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_ENV"

      -
        # 未配置 Docker Hub 凭据时只构建不推送，避免 login 失败把 CI 打红
        name: Check DockerHub credentials
        id: dockerhub
        run: |
          if [ "$PUBLISH_DOCKERHUB" = "true" ] && [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_PASSWORD" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "本次仅构建镜像；Docker Hub 推送须手动启用并配置凭据"
          fi
        env:
          PUBLISH_DOCKERHUB: ${{ inputs.publish_dockerhub }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Confirm published stable source
        if: steps.dockerhub.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [ "$(gh api "repos/$REPOSITORY/releases/latest" --jq .tag_name)" = "v$version" ]
          git fetch origin "refs/tags/v$version:refs/tags/v$version"
          git diff --exit-code "v$version" HEAD -- . ':!README.md'

      -
        name: Set Up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      -
        name: Set Up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      -
        name: Login DockerHub
        if: steps.dockerhub.outputs.available == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      -
        name: Buildx
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm,linux/s390x
          push: ${{ steps.dockerhub.outputs.available == 'true' }}
          tags: ${{ secrets.DOCKERHUB_USERNAME || 'local' }}/${{ env.IMAGE_NAME }}:latest,${{ secrets.DOCKERHUB_USERNAME || 'local' }}/${{ env.IMAGE_NAME }}:${{ env.version }}
