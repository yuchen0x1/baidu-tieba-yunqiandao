name: 发布 Windows 部署包

on:
  workflow_dispatch:
    inputs:
      enable_github_release:
        description: 'Temporary migration override. Enter enable to allow a GitHub Release.'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: 构建并发布 Windows 部署包
    # 当前项目只使用国内 Gitee 发布。该旧工作流仅在迁移时经双重显式开关启用。
    if: ${{ inputs.enable_github_release == 'enable' && vars.ALLOW_GITHUB_RELEASE_MIGRATION == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer

      - name: Install package dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Verify release source
        run: |
          composer validate --strict
          composer check

      - name: Remove development dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --classmap-authoritative

      - name: Build Windows package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          package="tieba-cloud-sign-windows-${RELEASE_TAG}.zip"
          zip -r "$package" . \
            -x '.git/*' '.github/*' 'tests/*' 'upgrade-report/*' '.phpunit.result.cache' '*.zip'
          sha256sum "$package" > "$package.sha256"
          echo "PACKAGE=$package" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$PACKAGE" "$PACKAGE.sha256" --repo "${{ github.repository }}" --clobber
          else
            gh release create "$RELEASE_TAG" "$PACKAGE" "$PACKAGE.sha256" \
              --repo "${{ github.repository }}" \
              --title "百度贴吧云签到 $RELEASE_TAG Windows 部署包" \
              --generate-notes
          fi
