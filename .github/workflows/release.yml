name: 发布 Windows 部署包

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: 构建并发布 Windows 部署包
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: tcs_it_bootstrap
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure tag points to main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/main"; then
            echo "Release tags must point to a commit already merged into main." >&2
            exit 1
          fi

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, mbstring, mysqli, zip
          tools: composer

      - name: Validate release source
        run: |
          composer install --prefer-dist --no-interaction --no-progress
          composer validate --strict
          composer check

      - name: Run database integration checks
        env:
          TCS_IT_DB_HOST: 127.0.0.1
          TCS_IT_DB_PORT: '3306'
          TCS_IT_DB_USER: root
          TCS_IT_DB_PASS: root
        run: composer integration

      - name: Validate tag and publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        shell: pwsh
        run: |
          $arguments = @{
            Tag = $env:RELEASE_TAG
            Owner = $env:REPOSITORY_OWNER
            Repository = $env:REPOSITORY_NAME
            Publish = $true
            Confirm = $false
          }
          $notes = "release-notes/$env:RELEASE_TAG.md"
          if (Test-Path -LiteralPath $notes) {
            $arguments.ReleaseNotesFile = $notes
          }
          tools/publish-github.ps1 @arguments
