name: 发布 Web 部署包

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    permissions:
      contents: write
    name: 构建并发布 Web 部署包
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Ensure tag points to main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/main"; then
            echo "Release tags must point to a commit already merged into main." >&2
            exit 1
          fi

      - name: Validate tag and publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        shell: pwsh
        run: |
          $arguments = @{
            Tag = $env:RELEASE_TAG
            Owner = $env:REPOSITORY_OWNER
            Repository = $env:REPOSITORY_NAME
            Publish = $true
            Confirm = $false
          }
          $notes = "release-notes/$env:RELEASE_TAG.md"
          if (-not (Test-Path -LiteralPath $notes)) { throw "Missing release notes $notes" }
          $arguments.ReleaseNotesFile = $notes
          tools/publish-github.ps1 @arguments

      - name: Verify public downloads and release attestation
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-check"
          cd "$RUNNER_TEMP/release-check"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"
          sha256sum --check ./*.sha256
          for attempt in 1 2 3 4 5; do
            if gh release verify "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"; then
              gh release verify-asset "$RELEASE_TAG" ./*.zip --repo "$GITHUB_REPOSITORY"
              exit 0
            fi
            sleep 5
          done
          exit 1
